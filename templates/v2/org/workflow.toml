# The twelve initial workflow entries. Ordinary tools remain blacklist-only.
# Existing orgs adopt changed source bytes only through the D6 transaction.

[[blacklist]]
id = "raw-codex-exec"
text = "Starting a raw Codex agent session bypasses the managed lane lifecycle."
instead = "laneboss lane start / laneboss lane resume / laneboss lane turn"
band = "refuse"
critical = false

