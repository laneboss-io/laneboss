<text x="28.0" y="62.0" class="sub" fill="#52514e">One judge, Jev (model jev-1.13.0) on 9 October 2026.</text>
<text x="28.0" y="79.0" class="sub" fill="#52514e">Five hand-written test subjects, each asked nine times:</text>
<text x="28.0" y="96.0" class="sub" fill="#52514e">is this tool result a refusal? One dot is one answer,</text>
<text x="28.0" y="113.0" class="sub" fill="#52514e">its probability of YES from 0 to 1.</text>
