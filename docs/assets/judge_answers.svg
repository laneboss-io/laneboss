<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 618" width="560" height="618" role="img" aria-labelledby="title desc">
<title id="title">The two refusal subjects scored 0.95 to 0.97: five hand-written test subjects, each asked nine times of one judge</title>
<desc id="desc">One dot is one answer on a scale of 0 to 1: the probability of YES to the question whether a tool result is a refusal. Refusal subjects (hook, harness): 18 answers from 0.95 to 0.97; Subjects that are not refusals (os, test): 18 answers from 0.05 to 0.09; Subject withheld (secret): 9 answers from 0.68 to 0.71. 45 answers in all, from Jev (model jev-1.13.0) on 9 October 2026; the subjects were written by hand for the trial, and nine identical requests each show how stable an answer is, not how accurate the judge is in general.</desc>
<style>
svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --rule: #dcdbd6;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) {
  svg { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --rule: #3b3b38;
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; }
}
.bg { fill: var(--surface); }
.title { font-size: 18px; font-weight: 600; fill: var(--ink); }
.sub { font-size: 13px; fill: var(--ink2); }
.row { font-size: 15px; font-weight: 600; fill: var(--ink); }
.note { font-size: 13px; fill: var(--ink2); }
.small { font-size: 12px; fill: var(--ink2); }
.tick { font-size: 12px; fill: var(--ink2); text-anchor: middle; }
.rule { stroke: var(--rule); stroke-width: 1; }
.dot { stroke: var(--surface); stroke-width: 2; paint-order: stroke; }
.s1 { fill: var(--s1); }
.s2 { fill: var(--s2); }
.s3 { fill: var(--s3); }
</style>
